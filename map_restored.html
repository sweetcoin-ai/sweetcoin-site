
<!DOCTYPE html>
<html>
  <head>
    <title>Sweetcoin Merchant Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body, #map { height: 100%; margin: 0; padding: 0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import config from './firebase-init.js';

      const app = firebase.initializeApp(config);
      const db = firebase.firestore();

      const map = L.map('map').setView([43.65107, -79.347015], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const merchantRef = db.collection("merchants");
      const approvedQuery = merchantRef.where("status", "==", "approved");

      approvedQuery.get().then((querySnapshot) => {
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if (data && data.lat && data.lng && data.name) {
            const marker = L.marker([data.lat, data.lng]).addTo(map);
            marker.bindPopup(`<b>${data.name}</b>`);
          }
        });
      }).catch((error) => {
        console.error("Error fetching approved merchants:", error);
      });
    </script>
  </body>
</html>
