<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Merchant Map</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="firebase-init.js"></script>
</head>
<body>
  <h2>Add Merchant</h2>
  <div id="map" style="height: 500px;"></div>
  <script>
    const map = L.map('map').setView([43.65107, -79.347015], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    map.on('click', async function(e) {
      const name = prompt("Enter merchant name:");
      const wallet = prompt("Enter wallet address:");
      if (!name || !wallet) return;

      const data = {
        name: name,
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        wallet: wallet,
        status: "pending",
        createdAt: new Date().toISOString(),
        remarks: ""
      };

      try {
        const db = firebase.firestore();
        await db.collection("merchants").add(data);
        alert("Merchant submitted for review.");
      } catch (err) {
        console.error("Error writing to Firebase:", err);
      }
    });
  </script>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
</body>
</html>
