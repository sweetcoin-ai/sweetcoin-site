<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sweetcoin Merchant Submission Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; }
    #form-popup {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="form-popup">
    <label>Store Name: <input type="text" id="storeName" /></label><br />
    <label>Wallet Address: <input type="text" id="walletAddress" /></label><br />
    <button onclick="submitApplication()">Submit</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    import { firebaseConfig } from './firebase-init.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let map = L.map('map').setView([43.65107, -79.347015], 12); // Default to Toronto
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let tempLatLng = null;

    map.on('click', function (e) {
      tempLatLng = e.latlng;
      document.getElementById('form-popup').style.display = 'block';
    });

    window.submitApplication = async function () {
      const name = document.getElementById('storeName').value.trim();
      const wallet = document.getElementById('walletAddress').value.trim();
      if (!name || !wallet || !tempLatLng) return alert("Please complete all fields.");

      try {
        await addDoc(collection(db, "merchants"), {
          name: name,
          wallet: wallet,
          lat: tempLatLng.lat,
          lng: tempLatLng.lng,
          status: "pending",
          createdAt: serverTimestamp(),
          remarks: ""
        });
        alert("Application submitted.");
        document.getElementById('form-popup').style.display = 'none';
      } catch (err) {
        alert("Submission failed: " + err.message);
      }
    }
  </script>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
</body>
</html>
