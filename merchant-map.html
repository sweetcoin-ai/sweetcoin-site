
<!DOCTYPE html>
<html>
<head>
    <title>Sweetcoin Merchant Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="firebase-init.js"></script>
</head>
<body>
    <div id="map" style="width: 100%; height: 100vh;"></div>
    <script>
        var map = L.map('map').setView([43.651070, -79.347015], 13); // Toronto

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        map.on('click', function(e) {
            var name = prompt("Enter store name:");
            if (!name) return;
            var wallet = prompt("Enter wallet address:");
            if (!wallet) return;

            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            var data = {
                name: name,
                wallet: wallet,
                lat: lat,
                lng: lng,
                status: "pending",
                createdAt: new Date().toISOString(),
                remarks: ""
            };

            firebase.database().ref("merchants").push(data).then(function() {
                alert("Submitted to Firebase.");
            });
        });
    </script>
</body>
</html>
