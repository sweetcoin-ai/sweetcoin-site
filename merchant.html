
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Merchant QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
    input { margin: 10px; padding: 8px; width: 80%; max-width: 300px; }
    button { padding: 10px 20px; font-size: 16px; }
    #qrcode { margin: 20px auto; }
  </style>
</head>
<body>
  <h2>Merchant QR Code Generator</h2>
  <input id="storeName" placeholder="Enter Store Name" /><br />
  <input id="walletAddress" placeholder="Enter Wallet Address" /><br />
  <button onclick="generateQR()">Generate QR Code</button>
  <div id="qrcode"></div>
  <br />
  <a href="map.html"><button>Submit to Map</button></a>

  <script>
    function generateQR() {
      const storeName = document.getElementById('storeName').value.trim();
      const wallet = document.getElementById('walletAddress').value.trim();
      const amount = "1";
      const qrData = JSON.stringify({ store: storeName, address: wallet, amount: amount });
      document.getElementById('qrcode').innerHTML = "";
      QRCode.toCanvas(document.getElementById('qrcode'), qrData, function (error) {
        if (error) console.error(error);
      });
    }
  </script>
</body>
</html>
