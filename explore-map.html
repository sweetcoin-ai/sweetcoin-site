<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Sweetcoin Merchant Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getFirestore, collection, query, where, getDocs
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDln4jwnhwI-Zg7NNRfRuHVzWqR70vK1fA",
      authDomain: "sweetcoin-map.firebaseapp.com",
      projectId: "sweetcoin-map",
      storageBucket: "sweetcoin-map.appspot.com",
      messagingSenderId: "324069311765",
      appId: "1:324069311765:web:fae78c5fd6a87be2a3fc25"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.addEventListener('DOMContentLoaded', async () => {
      const map = L.map('map').setView([43.65107, -79.347015], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const q = query(collection(db, "merchants"), where("status", "==", "approved"));
      const querySnapshot = await getDocs(q);
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const marker = L.marker([data.lat, data.lng]).addTo(map);
        marker.bindPopup(`<b>${data.name}</b><br>Wallet: ${data.wallet}`);
      });
    });
  </script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
</body>
</html>
