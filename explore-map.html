<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Explore Sweetcoin Merchants</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="firebase-init.js"></script>
</head>
<body>
  <h2>Explore Approved Merchants</h2>
  <div id="map" style="height: 500px;"></div>
  <script>
    const map = L.map('map').setView([20, 0], 2); // Global view
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    async function loadMerchants() {
      try {
        const db = firebase.firestore();
        const snapshot = await db.collection("merchants").where("status", "==", "approved").get();
        snapshot.forEach(doc => {
          const m = doc.data();
          if (m.lat && m.lng) {
            L.marker([m.lat, m.lng]).addTo(map)
              .bindPopup(`<b>${m.name}</b><br>${m.wallet}`);
          }
        });
      } catch (err) {
        console.error("Error loading merchants:", err);
      }
    }

    loadMerchants();
  </script>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
</body>
</html>
