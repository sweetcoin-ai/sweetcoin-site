
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Explore Sweetcoin Merchant Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="firebase-init.js"></script>
  <script>
    console.log("开始加载 Firebase...");
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);

    const map = L.map('map').setView([43.65, -79.38], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    console.log("地图初始化成功");

    db.collection("merchants").get().then((querySnapshot) => {
      console.log("开始获取商家列表...");
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        console.log("商家数据：", data);
        if (data.status === "approved") {
          const marker = L.marker([data.lat, data.lng]).addTo(map);
          marker.bindPopup(
            `<b>${data.name}</b><br/>Wallet: ${data.wallet || 'N/A'}<br/>Remarks: ${data.remarks || ''}`
          );
        }
      });
    }).catch((error) => {
      console.error("Error getting documents: ", error);
    });
  </script>
</body>
</html>
