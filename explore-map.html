
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Explore Sweetcoin Merchants</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2atJbLdJGSfPDZiKzUgUQ1p1gEaPsy8ikVoHgvM=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j7kGStbE5xC61TkaUftnpAU4l0wE8PaPb140P8M=" crossorigin=""></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const db = firebase.firestore();
    const map = L.map('map').setView([43.6532, -79.3832], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    db.collection("merchants").get().then((querySnapshot) => {
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.status === "approved") {
          const marker = L.marker([data.lat, data.lng]).addTo(map);
          marker.bindPopup(
            `<b>${data.name}</b><br/>Wallet: ${data.wallet || 'N/A'}<br/>Remarks: ${data.remarks || ''}`
          );
        }
      });
    }).catch((error) => {
      console.error("Error getting documents: ", error);
    });
  </script>
</body>
</html>
