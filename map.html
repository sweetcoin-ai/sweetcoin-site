<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sweetcoin Merchant Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+4jDbsxG+3jStkOYf+zWLuZ4pucXz8mLTLyyLZpzw="
    crossorigin=""
  />
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
    #approved-merchants {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Approved Merchants</h1>
  <div id="map"></div>
  <div id="approved-merchants"></div>

  <script type="module">
    import { db } from './firebase-init.js';

    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const approvedQuery = db.collection("merchants").where("status", "==", "approved");
    approvedQuery.get().then((querySnapshot) => {
      const container = document.getElementById("approved-merchants");
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const marker = L.marker([data.lat, data.lng]).addTo(map);
        marker.bindPopup(`<strong>${data.name}</strong><br/>Wallet: ${data.wallet}`);
        const div = document.createElement("div");
        div.innerHTML = `<strong>${data.name}</strong><br/>${data.wallet || ""}<hr>`;
        container.appendChild(div);
      });
    });
  </script>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j7kBQo3f6tEcCkDQjXtK3CozSkVbLr3/1C6tRUA="
    crossorigin=""
  ></script>
</body>
</html>
