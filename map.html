<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<title>Approved Merchants</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
<style>
    #map { height: 100vh; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCl6u3GEqgXX5fZaHExFlQmLr8JYtqvKfY",
      authDomain: "sweetcoin-map.firebaseapp.com",
      projectId: "sweetcoin-map",
      storageBucket: "sweetcoin-map.appspot.com",
      messagingSenderId: "213387673195",
      appId: "1:213387673195:web:e93bfa7bde207ca5b4d1f0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const map = L.map('map').setView([43.6532, -79.3832], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    async function loadApprovedMerchants() {
      const approvedQuery = query(collection(db, "merchants"), where("status", "==", "approved"));
      const snapshot = await getDocs(approvedQuery);
      snapshot.forEach((doc) => {
        const data = doc.data();
        if (data.lat && data.lng) {
          const marker = L.marker([data.lat, data.lng]).addTo(map);
          marker.bindPopup(`<strong>${data.name}</strong><br>Wallet: ${data.wallet}`);
        }
      });
    }

    loadApprovedMerchants();
  </script>
</body>
</html>
