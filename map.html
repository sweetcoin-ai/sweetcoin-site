
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Sweetcoin Merchant Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script type="module">
    import { db } from './firebase-init.js';
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const map = L.map('map').setView([43.6532, -79.3832], 12); // 默认多伦多

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    async function loadApprovedMerchants() {
      const approvedQuery = query(
        collection(db, "merchants"),
        where("status", "==", "approved")
      );
      const querySnapshot = await getDocs(approvedQuery);

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const marker = L.marker([data.lat, data.lng]).addTo(map);
        marker.bindPopup(`<strong>${data.name}</strong><br>Wallet: ${data.wallet}`);
      });
    }

    loadApprovedMerchants();
  </script>
</body>
</html>
