<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Sweetcoin Merchant Map</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
    .leaflet-popup-content input { display: block; margin-bottom: 5px; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import { db } from './firebase-init.js';

    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 显示已审核商家
    async function loadApprovedMerchants() {
      const querySnapshot = await db.collection("merchants").where("status", "==", "approved").get();
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        if (data.lat && data.lng) {
          const marker = L.marker([data.lat, data.lng]).addTo(map);
          marker.bindPopup(
            `<b>${data.name}</b><br>Wallet: ${data.wallet}`
          );
        }
      });
    }

    loadApprovedMerchants();

    // 提交新商家
    map.on('click', function (e) {
      const popup = L.popup()
        .setLatLng(e.latlng)
        .setContent(`
          <b>Submit Your Business</b><br>
          <input type="text" id="name" placeholder="Business Name" />
          <input type="text" id="wallet" placeholder="Wallet Address" />
          <button onclick="submitMerchant(${e.latlng.lat}, ${e.latlng.lng})">Submit</button>
        `)
        .openOn(map);
    });

    window.submitMerchant = async function(lat, lng) {
      const name = document.getElementById('name').value;
      const wallet = document.getElementById('wallet').value;
      if (!name || !wallet) {
        alert("Please enter all fields.");
        return;
      }
      try {
        await db.collection("merchants").add({
          name, wallet, lat, lng, status: "pending"
        });
        alert("Submitted! Waiting for approval.");
      } catch (err) {
        alert("Error submitting: " + err.message);
      }
    };
  </script>
</body>
</html>
