
<!DOCTYPE html>
<html>
<head>
  <title>Sweetcoin Merchant Map - Debug Mode</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script type="module">
    import {{ db }} from './firebase-init.js';
    import {{ collection, getDocs }} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    window.onload = async () => {{
      const log = (msg) => {{
        const el = document.createElement("div");
        el.textContent = msg;
        document.body.appendChild(el);
      }};

      log("🌐 页面已加载，开始连接 Firebase...");

      try {{
        const merchantsCol = collection(db, "merchants");
        const snapshot = await getDocs(merchantsCol);
        log(`📥 读取商家总数: ${snapshot.size}`);

        const approved = [];
        snapshot.forEach(doc => {{
          const data = doc.data();
          if (data.status === "approved") {{
            approved.push(data);
          }}
        }});

        log(`✅ 已审核商家数: ${approved.length}`);
        approved.forEach((m, i) => {{
          log(`🟢 商家 ${i + 1}: ${m.name} (${m.lat}, ${m.lng})`);
        }});

        const map = L.map('map').setView([43.6532, -79.3832], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {{
          attribution: '© OpenStreetMap contributors'
        }}).addTo(map);

        approved.forEach(m => {{
          if (m.lat && m.lng) {{
            L.marker([m.lat, m.lng]).addTo(map)
              .bindPopup(`<b>${m.name}</b><br>${m.remarks || ''}<br>${m.wallet || ''}`);
          }}
        }});
      }} catch (err) {{
        log("❌ 读取失败：" + err.message);
        console.error(err);
      }}
    }};
  </script>
  <style>
    html, body, #map {{
      height: 90%;
      margin: 0;
      padding: 0;
    }}
    body {{
      font-family: monospace;
      padding: 10px;
    }}
  </style>
</head>
<body>
  <h2>🗺️ Sweetcoin Debug 地图</h2>
  <div id="map"></div>
</body>
</html>
