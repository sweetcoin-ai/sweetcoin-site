
<!DOCTYPE html>
<html>
<head>
    <title>Sweetcoin Merchant Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>

    <button onclick="showSubmission()">Merchant Submission Map</button>
    <button onclick="showExplore()">Explore Approved Merchants</button>

    <div id="merchantMapContainer" style="width: 100%; height: 600px;">
        <div id="merchantMap" style="width: 100%; height: 100%;"></div>
    </div>

    <div id="exploreMapContainer" style="width: 100%; height: 600px; display: none;">
        <div id="exploreMap" style="width: 100%; height: 100%;"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sweetcoin-map.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function showSubmission() {
            document.getElementById('merchantMapContainer').style.display = 'block';
            document.getElementById('exploreMapContainer').style.display = 'none';
        }

        function showExplore() {
            document.getElementById('merchantMapContainer').style.display = 'none';
            document.getElementById('exploreMapContainer').style.display = 'block';
        }

        const merchantMap = L.map('merchantMap').setView([43.65107, -79.347015], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(merchantMap);

        merchantMap.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            const storeName = prompt("Enter store name:");
            const wallet = prompt("Enter wallet address:");

            if (storeName && wallet) {
                const marker = L.marker([lat, lng]).addTo(merchantMap)
                    .bindPopup(`<b>${storeName}</b><br>${wallet}`);
                db.ref("pending_merchants").push({ storeName, wallet, lat, lng, approved: false });
            }
        });

        const exploreMap = L.map('exploreMap').setView([43.65107, -79.347015], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(exploreMap);

        db.ref("pending_merchants").once("value", snapshot => {
            snapshot.forEach(child => {
                const data = child.val();
                if (data.approved) {
                    L.marker([data.lat, data.lng]).addTo(exploreMap)
                        .bindPopup(`<b>${data.storeName}</b><br>${data.wallet}`);
                }
            });
        });
    </script>

</body>
</html>
