
<!DOCTYPE html>

<html>
<head>
<title>Sweetcoin Debug 地图</title>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet"/>
</head>
<body>
<div id="map"></div>
<script type="module">
    import config from './firebase-init.js';

    const app = firebase.initializeApp(config);
    console.log("✅ Firebase initialized");

    const db = firebase.firestore();
    console.log("📦 Firestore initialized");

    const map = L.map('map').setView([43.65, -79.38], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    db.collection("merchants").where("status", "==", "approved").get()
      .then((querySnapshot) => {
        console.log("✅ Approved merchants fetched:", querySnapshot.size);
        if (querySnapshot.empty) {
          alert("没有通过审核的商家！");
        }
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const lat = data.lat;
          const lng = data.lng;
          const name = data.name || "商家";
          if (lat && lng) {
            L.marker([lat, lng]).addTo(map).bindPopup(name);
          }
        });
      })
      .catch((error) => {
        console.error("❌ Error fetching merchants:", error);
        alert("读取商家失败：" + error.message);
      });
  </script>
</body>
</html>
